# KELEDON Web — nginx config for Railway multi-service
# API proxied to keledon-api via Railway private network.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to keledon-api.
    # Legacy private-network upstream preserved for reference: http://keledon-api.railway.internal:3001
    # First public-custom-domain attempt preserved for reference: https://keledonapi.tuyoisaza.com
    # Railway private DNS can go stale between services and caused /api/auth/google 504s while the API stayed healthy.
    # The custom API domain can trigger Cloudflare bot challenge for server-to-server proxy requests, so HTTP/REST
    # traffic uses Railway's public upstream directly; /ws/ remains on private DNS for WebSocket upgrade support.
    location /api/ {
        proxy_pass https://keledon-api-production.up.railway.app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host keledon-api-production.up.railway.app;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
    }

    # TTS proxy — same upstream as /api/ (NestJS @Controller('tts') has no /api prefix)
    location /tts/ {
        proxy_pass https://keledon-api-production.up.railway.app;
        proxy_http_version 1.1;
        proxy_set_header Host keledon-api-production.up.railway.app;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
    }

    # WebSocket proxy for device/browser connections
    location /ws/ {
        proxy_pass http://keledon-api.railway.internal:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 15s;
        proxy_read_timeout 86400s;  # Keep WS connections alive
    }
}
