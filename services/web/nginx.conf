# KELEDON Web — nginx config for Railway multi-service
# API proxied to keledon-api via Railway private network.

# Keep this allowlist aligned with AppRouter.tsx. The two parameterized routes
# accept exactly one path segment, matching React Router's :id parameters.
map $uri $known_spa_route {
    default 0;
    ~^/login/?$ 1;
    ~^/test-browser/?$ 1;
    ~^/launch-keledon/?$ 1;
    ~^/dashboard/?$ 1;
    ~^/brain/?$ 1;
    ~^/profile/?$ 1;
    ~^/devices/?$ 1;
    ~^/knowledge/?$ 1;
    ~^/admin/?$ 1;
    ~^/admin/users/?$ 1;
    ~^/admin/settings/?$ 1;
    ~^/admin/settings/templates/?$ 1;
    ~^/admin/audit/?$ 1;
    ~^/admin/team-settings/?$ 1;
    ~^/flows/?$ 1;
    ~^/subagents/?$ 1;
    ~^/superadmin/?$ 1;
    ~^/management/?$ 1;
    ~^/management/companies/?$ 1;
    ~^/management/brands/?$ 1;
    ~^/management/teams/?$ 1;
    ~^/management/users/?$ 1;
    ~^/management/keledons/?$ 1;
    ~^/management/flow-definitions/?$ 1;
    ~^/management/flows/?$ 1;
    ~^/management/voice-profiles/?$ 1;
    ~^/management/providers/?$ 1;
    ~^/management/vendors/?$ 1;
    ~^/management/workflows/?$ 1;
    ~^/management/vector-store/?$ 1;
    ~^/management/vector-store/add-document/?$ 1;
    ~^/management/vector-store/categories/?$ 1;
    ~^/management/debug/?$ 1;
    ~^/management/status/?$ 1;
    ~^/sessions/?$ 1;
    ~^/sessions/live/?$ 1;
    ~^/sessions/history/?$ 1;
    ~^/work-stats/?$ 1;
    ~^/knowledge-stats/?$ 1;
    ~^/admin/prompts/?$ 1;
    ~^/admin/ai-consumption/?$ 1;
    ~^/sessions/[^/]+/?$ 1;
    ~^/management/vector-store/edit-document/[^/]+/?$ 1;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;

    location = /index.html {
        return 301 /;
    }

    # The marketing home is the only route intended for search discovery.
    location = / {
        # Serve the SPA entry file in this exact location. Using the index
        # module or /index.html as a fallback URI can internally redirect to
        # location / and inherit its private-route noindex header.
        try_files /index.html =404;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' wss://keledon.tuyoisaza.com wss://keledonapi.tuyoisaza.com https://keledonapi.tuyoisaza.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:;" always;
        add_header X-Robots-Tag "index, follow" always;
    }

    location / {
        try_files $uri $uri/ @spa;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' wss://keledon.tuyoisaza.com wss://keledonapi.tuyoisaza.com https://keledonapi.tuyoisaza.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:;" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location @spa {
        if ($known_spa_route = 0) {
            return 404;
        }
        rewrite ^ /app.html last;
    }

    location = /app.html {
        internal;
        try_files $uri =404;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' wss://keledon.tuyoisaza.com wss://keledonapi.tuyoisaza.com https://keledonapi.tuyoisaza.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:;" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /404.html {
        try_files $uri =404;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # API proxy to keledon-api.
    # Legacy private-network upstream preserved for reference: http://keledon-api.railway.internal:3001
    # First public-custom-domain attempt preserved for reference: https://keledonapi.tuyoisaza.com
    # Railway private DNS can go stale between services and caused /api/auth/google 504s while the API stayed healthy.
    # The custom API domain can trigger Cloudflare bot challenge for server-to-server proxy requests, so HTTP/REST
    # traffic uses Railway's public upstream directly; /ws/ remains on private DNS for WebSocket upgrade support.
    location /api/ {
        proxy_pass https://keledon-api-production.up.railway.app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host keledon-api-production.up.railway.app;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
    }

    # TTS proxy — same upstream as /api/ (NestJS @Controller('tts') has no /api prefix)
    location /tts/ {
        proxy_pass https://keledon-api-production.up.railway.app;
        proxy_http_version 1.1;
        proxy_set_header Host keledon-api-production.up.railway.app;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
    }

    # WebSocket proxy for device/browser connections
    location /ws/ {
        proxy_pass http://keledon-api.railway.internal:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 15s;
        proxy_read_timeout 86400s;  # Keep WS connections alive
    }

    # Socket.IO proxy for Brain page realtime chat
    location /socket.io/ {
        proxy_pass https://keledon-api-production.up.railway.app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host keledon-api-production.up.railway.app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_connect_timeout 15s;
        proxy_read_timeout 86400s;
    }
}
