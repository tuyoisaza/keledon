# KELEDON Web — nginx config for Railway multi-service
# API is proxied to keledon-api via Railway private network.
# Uses variable-based proxy_pass to survive API service not-yet-deployed state.

resolver 127.0.0.11 valid=10s;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to keledon-api service (Railway private network)
    # Variable-based so nginx resolves at runtime, not at startup
    set $api_upstream http://keledon-api.railway.internal:3001;
    location /api/ {
        proxy_pass $api_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
    }
}
