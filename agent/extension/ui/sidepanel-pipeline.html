<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KELEDON Agent</title>
    <link rel="stylesheet" href="sidepanel-pipeline.css">
    <link rel="stylesheet" href="sidepanel-pipeline-panels.css">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <div class="header">
            <div class="brand">
                <div class="logo">K</div>
                <div>
                    <div style="font-weight: 600;">KELEDON</div>
                    <div class="version" id="version">v2.17</div>
                </div>
            </div>
            <div class="header-controls">
                <div class="status-indicator" id="statusIndicator"></div>
                <button class="input-btn" id="logToggleBtn" title="Toggle Logs">📋</button>
                <button class="input-btn" id="settingsBtn" title="Settings">⚙️</button>
            </div>
        </div>

        <!-- Tab Navigation -->
        <div class="tab-nav" role="tablist" aria-label="Main navigation">
            <button class="tab-btn active" data-tab="chat" role="tab" aria-selected="true" aria-controls="chat-tab">💬 Chat</button>
            <button class="tab-btn" data-tab="tabs" role="tab" aria-selected="false" aria-controls="tabs-tab">📑 Tabs</button>
            <button class="tab-btn" data-tab="history" role="tab" aria-selected="false" aria-controls="history-tab">📜 History</button>
            <button class="tab-btn" data-tab="settings" role="tab" aria-selected="false" aria-controls="settings-tab">⚙️ Settings</button>
        </div>

        <!-- Main Content -->
        <div class="main-content" role="main">
            <!-- Chat Tab -->
            <div class="tab-content active" id="chat-tab" role="tabpanel" aria-labelledby="chat-tab-btn">
                <div class="command-section">
                    <div class="input-group">
                        <input type="text" class="command-input" id="commandInput" placeholder="Enter command or question..." aria-label="Command input">
                        <button class="input-btn voice-btn" id="voiceBtn" title="Transcribe WebRTC Audio" aria-label="Transcribe WebRTC Audio" role="button">📝</button>
                        <button class="input-btn mic-btn" id="micBtn" title="Microphone - Send to Brain" aria-label="Microphone input" role="button">🎤</button>
                        <button class="input-btn" id="sendBtn" title="Send" aria-label="Send message" role="button">➤</button>
                    </div>
                    <div class="suggestions" id="suggestions">
                        <div class="suggestion-chip" id="testConnectionBtn" style="background: var(--info); color: white;">Test Connection</div>
                        <div class="suggestion-chip" id="checkStatusBtn" style="background: var(--muted); color: white;">Check Status</div>
                        <div class="suggestion-chip" id="testTTSDryRun" style="background: var(--accent); color: white;">🔊 Test TTS</div>
                    </div>
                </div>
                <div class="content-area">
                    <div class="conversation" id="conversation">
                        <div class="message assistant">
                            <div>🔧 KELEDON Phase O/N-1: Basic functionality test</div>
                            <div class="message-time">Just now</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tabs Tab -->
            <div class="tab-content" id="tabs-tab">
                <div class="content-area">
                    <div class="tab-list" id="tabList">
                        <div class="loading">
                            <div class="spinner"></div>
                            Loading tabs...
                        </div>
                    </div>
                </div>
            </div>

            <!-- History Tab -->
            <div class="tab-content" id="history-tab">
                <div class="content-area">
                    <div class="history-list" id="historyList">
                        <div class="loading">
                            <div class="spinner"></div>
                            Loading history...
                        </div>
                    </div>
                </div>
            </div>

            <!-- Settings Tab -->
            <div class="tab-content" id="settings-tab">
                <div class="content-area">
                    <div class="settings-group">
                        <label class="settings-label">Language</label>
                        <select class="settings-select" id="languageSelect">
                            <option value="en">English</option>
                            <option value="es">Spanish</option>
                            <option value="fr">French</option>
                            <option value="de">German</option>
                            <option value="zh">Chinese</option>
                        </select>
                    </div>

                    <div class="settings-group">
                        <label class="settings-label">Voice Settings</label>
                        <div class="settings-toggle">
                            <div class="toggle-switch" id="voiceToggle">
                                <div class="toggle-slider"></div>
                            </div>
                            <label>Enable voice commands</label>
                        </div>
                        <div class="settings-toggle">
                            <div class="toggle-switch active" id="autoListenToggle">
                                <div class="toggle-slider"></div>
                            </div>
                            <label>Auto-listen on page load</label>
                        </div>
                    </div>

                    <div class="settings-group">
                        <label class="settings-label">AI Assistant</label>
                        <div class="settings-toggle">
                            <div class="toggle-switch active" id="smartSuggestionsToggle">
                                <div class="toggle-slider"></div>
                            </div>
                            <label>Smart suggestions</label>
                        </div>
                        <div class="settings-toggle">
                            <div class="toggle-switch" id="contextAwareToggle">
                                <div class="toggle-slider"></div>
                            </div>
                            <label>Context-aware assistance</label>
                        </div>
                    </div>

                    <div class="settings-group">
                        <label class="settings-label">Privacy</label>
                        <div class="settings-toggle">
                            <div class="toggle-switch active" id="saveHistoryToggle">
                                <div class="toggle-slider"></div>
                            </div>
                            <label>Save command history</label>
                        </div>
                        <div class="settings-toggle">
                            <div class="toggle-switch" id="analyticsToggle">
                                <div class="toggle-slider"></div>
                            </div>
                            <label>Share usage analytics</label>
                        </div>
                    </div>

                    <div class="settings-group">
                        <label class="settings-label">Agent Control</label>
                        <div class="settings-toggle">
                            <div class="toggle-switch active" id="agentActiveToggle">
                                <div class="toggle-slider"></div>
                            </div>
                            <label>Agent Active (Master Control)</label>
                        </div>
                    </div>

                    <div class="settings-group">
                        <label class="settings-label">Backend URL</label>
                        <input type="text" class="settings-input" id="backendUrl" value="" placeholder="Backend server URL" data-default="http://localhost:3001">
                    </div>
                </div>
            </div>
        </div>

        <!-- Log Panel -->
        <div class="log-panel" id="logPanel" style="display: none;">
            <div class="log-header">
                <span>Logs</span>
                <div class="log-actions">
                    <button class="log-btn" id="copyLogBtn" title="Copy Logs">📋 Copy</button>
                    <button class="log-btn" id="pasteLogBtn" title="Paste Logs">📝 Paste</button>
                    <button class="log-btn" id="clearLogBtn" title="Clear Logs">🗑️ Clear</button>
                    <button class="log-btn" id="closeLogBtn" title="Close Logs">✕</button>
                </div>
            </div>
            <div class="log-content" id="logs-content"></div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar" role="status" aria-live="polite" aria-label="Connection status">
            <div class="connection-status">
                <div class="status-dot" id="connectionDot" aria-hidden="true"></div>
                <span id="connectionStatus">Disconnected</span>
            </div>
            <div class="component-status" aria-label="Component status indicators">
                <div class="component-indicator">
                    <div class="status-dot" id="websocketStatus" title="WebSocket Connection"></div>
                    <span>WS</span>
                </div>
                <div class="component-indicator">
                    <div class="status-dot" id="sttStatus" title="Speech-to-Text"></div>
                    <span>STT</span>
                </div>
                <div class="component-indicator">
                    <div class="status-dot" id="ttsStatus" title="Text-to-Speech"></div>
                    <span>TTS</span>
                </div>
                <div class="component-indicator">
                    <div class="status-dot" id="webrtcStatus" title="WebRTC Audio Injection"></div>
                    <span>WebRTC</span>
                </div>
            </div>
            <div>
                <span id="sessionInfo">No active session</span>
            </div>
        </div>
    </div>

    <script src="sidepanel.js"></script>
</body>
</html>
